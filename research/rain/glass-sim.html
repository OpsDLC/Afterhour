<!doctype html><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&display=block" rel="stylesheet">
<style>body{margin:0;background:#fff}canvas{display:block}</style>
<canvas id=c></canvas>

// ---------------- rendering: text seen through the glass + a water map ----------------
const c = document.getElementById('c'); c.width = W * 3; c.height = H; const ctx = c.getContext('2d');
let sd, ink, inkSoft;

const P = new URLSearchParams(location.search); let view = P.get('view') || 'compare';
addEventListener('keydown', (e) => { if (e.key === 'v') view = view === 'lens' ? 'fusion' : 'lens'; });
function render(intensity, t) {

    ctx.fillStyle = '#888'; ctx.font = '13px system-ui'; ctx.fillText('fusion · current', 14, H - 14); ctx.fillText('fusion · 1  only the stretch behind the drop', W + 14, H - 14); ctx.fillText('fusion · 2  water narrowed to 60%', 2 * W + 14, H - 14);
