<!doctype html><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Arimo:wght@400;700&display=block" rel="stylesheet">
<style>body{margin:0;background:#fff}canvas{display:block}</style>
<canvas id=c></canvas>
<script>
const P=new URLSearchParams(location.search);
const W=+P.get('w')||1400,H=+P.get('h')||620,INT=+(P.get('rain')??0.6),FONT=P.get('font')||'EB Garamond',SEED=+P.get('seed')||3;
let seed=SEED;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const c=document.getElementById('c');c.width=W;c.height=H;c.style.width=W/2+'px';const ctx=c.getContext('2d');
let src,sd;
function makeText(){const t=document.createElement('canvas');t.width=W;t.height=H;const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';
 x.font=`500 200px "${FONT}"`;x.fillText('Afterhour',90,250);x.font=`400 104px "${FONT}"`;x.fillText('the rain keeps the',94,420);x.fillText('letters awake',94,540);src=x.getImageData(0,0,W,H);sd=src.data}
// drops: flat, irregular, slightly tall; big ones slide and leave beaded trails
const drops=[];const trail=new Float32Array(W*H);
function newDrop(x,y,r){return{x,y,r,vy:0,sy:1+rnd()*.25,ph:[rnd()*6,rnd()*6],am:[.08+rnd()*.1,.04+rnd()*.06],wob:rnd()*6}}
function spawn(n){for(let i=0;i<n;i++){const r=2.5+Math.pow(rnd(),3.2)*(10+INT*16);drops.push(newDrop(rnd()*W,rnd()*H,r))}}
function radiusAt(d,th){return d.r*(1+d.am[0]*Math.sin(3*th+d.ph[0])+d.am[1]*Math.sin(5*th+d.ph[1]))}
function step(dt){
 // rain keeps landing
 if(rnd()<0.4+INT*1.2)spawn(1+Math.floor(INT*2));
 for(const d of drops){ if(d.r>15){d.vy=Math.min(d.vy+dt*90*(d.r/20),120+d.r*6)}else d.vy*=.9;
  if(d.vy>1){const oy=d.y;d.y+=d.vy*dt;d.x+=Math.sin(d.y*.02+d.wob)*.6;d.sy=1.15+Math.min(.5,d.vy/200);
   // wet trail + occasional bead left behind
   const w=d.r*.35;for(let y=Math.floor(oy);y<d.y;y++)for(let dx=-w;dx<=w;dx++){const X=Math.round(d.x+dx);if(X>=0&&X<W&&y>=0&&y<H)trail[y*W+X]=1}
   if(rnd()<.25){drops.push(newDrop(d.x+(rnd()-.5)*w,oy-d.r,1.5+rnd()*3));d.r*=.995}}}
 // merge overlapping drops (bigger absorbs smaller)
 drops.sort((a,b)=>b.r-a.r);
 for(let i=0;i<drops.length;i++){const a=drops[i];if(!a)continue;for(let j=i+1;j<drops.length;j++){const b=drops[j];if(!b||b.dead)continue;if(Math.hypot(a.x-b.x,(a.y-b.y))<(a.r+b.r)*.55){a.r=Math.min(34,Math.sqrt(a.r*a.r+b.r*b.r));b.dead=1}}}
 for(let i=drops.length-1;i>=0;i--)if(drops[i].dead||drops[i].y-drops[i].r>H)drops.splice(i,1);
 for(let i=0;i<trail.length;i++)if(trail[i]>0)trail[i]=Math.max(0,trail[i]-dt*.25);
}
function sample(o,k,sx,sy){sx=Math.max(0,Math.min(W-2,sx));sy=Math.max(0,Math.min(H-2,sy));const x0=sx|0,y0=sy|0,fx=sx-x0,fy=sy-y0,j=(y0*W+x0)*4;for(let c=0;c<3;c++)o[k+c]=(sd[j+c]*(1-fx)+sd[j+4+c]*fx)*(1-fy)+(sd[j+W*4+c]*(1-fx)+sd[j+W*4+4+c]*fx)*fy;o[k+3]=255}
function render(){const img=new ImageData(new Uint8ClampedArray(sd),W,H),o=img.data;
 // trails: thin wet streak shifts strokes sideways and stretches them a little
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=trail[y*W+x];if(t<=0)continue;sample(o,(y*W+x)*4,x+Math.sin(y*.09)*2.2*t,y-6*t)}
 // drops: crisp-edged lenses. inside = magnified (big drops flip), rim = compressed ring
 for(const d of drops){const R=Math.ceil(d.r*1.3*d.sy)+1;const mag=1.25+Math.min(1,d.r/40)*.9;const flip=d.r>14?-1:1;
  for(let y=-R;y<=R;y++){const Y=Math.round(d.y)+y;if(Y<0||Y>=H)continue;for(let x=-R;x<=R;x++){const X=Math.round(d.x)+x;if(X<0||X>=W)continue;
   const yy=y/d.sy;const th=Math.atan2(yy,x),rr=radiusAt(d,th),dist=Math.hypot(x,yy)/rr;if(dist>=1)continue;
   const s=flip/mag*(1+1.8*Math.pow(dist,4)); // strong compression near the rim
   sample(o,(Y*W+X)*4,d.x+x*s,d.y+y*s)}}}
 ctx.putImageData(img,0,0)}
document.fonts.load(`200px "${FONT}"`).then(()=>{makeText();spawn(Math.round(40+INT*330));
 const pre=+P.get('pre')||120;for(let i=0;i<pre;i++)step(1/30);render();document.body.dataset.ready=1;
 if(P.get('anim')){let last=performance.now();const loop=t=>{step(Math.min(.05,(t-last)/1000));last=t;render();requestAnimationFrame(loop)};requestAnimationFrame(loop)}})
</script>
