<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afterhour</title>
  </head>
  <body>
    <div class="small-screen" role="alert">
      <p>Afterhour needs a desktop browser.</p>
      <button type="button" id="open-anyway">Open anyway</button>
    </div>

    <div class="app" id="app">
      <aside id="panel" aria-label="Controls">
        <header class="panel-header">
          <h1 class="brand">Afterhour</h1>
          <button
            type="button"
            id="panel-toggle"
            class="icon-button"
            aria-controls="panel-body"
            aria-expanded="true"
            aria-label="Hide controls"
          >
            «
          </button>
        </header>

        <div id="panel-body">
          <section class="group" aria-labelledby="g-text">
            <h2 class="group-title"><label for="text-input" id="g-text">Text</label></h2>
            <textarea id="text-input" rows="4" spellcheck="false"></textarea>
          </section>

          <div class="tabs" role="tablist" aria-label="Control groups">
            <button
              type="button"
              role="tab"
              id="tab-type"
              aria-controls="tp-type"
              aria-selected="true"
            >
              Type
            </button>
            <button
              type="button"
              role="tab"
              id="tab-layout"
              aria-controls="tp-layout"
              aria-selected="false"
              tabindex="-1"
            >
              Layout
            </button>
            <button
              type="button"
              role="tab"
              id="tab-rain"
              aria-controls="tp-rain"
              aria-selected="false"
              tabindex="-1"
              aria-disabled="true"
              title="Sprint 2"
            >
              Rain
            </button>
          </div>

          <div role="tabpanel" id="tp-type" aria-labelledby="tab-type">
            <section class="group" aria-labelledby="g-font">
              <h2 class="group-title"><label for="font-search" id="g-font">Font</label></h2>
              <p class="font-current" id="font-current" aria-live="polite"></p>
              <div class="combo">
                <input
                  id="font-search"
                  type="text"
                  role="combobox"
                  aria-expanded="false"
                  aria-controls="font-list"
                  aria-autocomplete="list"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="Search fonts"
                />
                <ul id="font-list" role="listbox" aria-label="Fonts" hidden></ul>
              </div>
              <label class="upload">
                <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2" />
                Upload a font file (.ttf .otf .woff .woff2) or drop it anywhere
              </label>
              <p class="error" id="font-error" role="alert" hidden></p>
            </section>
            <section class="group" aria-labelledby="g-size">
              <h2 id="g-size" class="group-title">Size</h2>
              <fieldset class="field weights">
                <legend>Weight</legend>
                <div class="segmented">
                  <label><input type="radio" name="font-weight" value="100" />100</label>
                  <label><input type="radio" name="font-weight" value="200" />200</label>
                  <label><input type="radio" name="font-weight" value="300" />300</label>
                  <label><input type="radio" name="font-weight" value="400" />400</label>
                  <label><input type="radio" name="font-weight" value="500" />500</label>
                  <label><input type="radio" name="font-weight" value="600" />600</label>
                  <label><input type="radio" name="font-weight" value="700" />700</label>
                  <label><input type="radio" name="font-weight" value="800" />800</label>
                  <label><input type="radio" name="font-weight" value="900" />900</label>
                </div>
              </fieldset>
              <div class="field">
                <label for="font-size-range">Size</label>
                <input type="range" id="font-size-range" min="12" max="240" step="1" />
                <input
                  type="number"
                  id="font-size-number"
                  min="12"
                  max="240"
                  step="1"
                  aria-label="Size in pixels"
                />
                <span class="unit">px</span>
              </div>
            </section>
          </div>

          <div role="tabpanel" id="tp-layout" aria-labelledby="tab-layout" hidden>
            <section class="group" aria-labelledby="g-spacing">
              <h2 id="g-spacing" class="group-title">Spacing</h2>
              <p class="placeholder">Tracking, line height, width (H4N-15)</p>
            </section>
            <section class="group" aria-labelledby="g-align">
              <h2 id="g-align" class="group-title">Alignment</h2>
              <p class="placeholder">Left / Center / Right (H4N-15)</p>
            </section>
          </div>

          <div role="tabpanel" id="tp-rain" aria-labelledby="tab-rain" hidden></div>
        </div>
      </aside>

      <main id="preview">
        <button
          type="button"
          id="panel-show"
          class="icon-button"
          aria-controls="panel"
          aria-label="Show controls"
          hidden
        >
          »
        </button>
        <p class="preview-text" id="preview-text"></p>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
