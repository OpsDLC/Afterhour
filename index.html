<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#14161A">
  <meta name="description" content="Afterhour — a 2D glyph tool: night-rain drops refract, magnify and drag your letterforms. Exports clean SVG.">
  <title>Afterhour</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar top">
    <span class="mark">Afterhour</span>
    <span id="status" class="status" aria-live="polite"></span>
    <div class="actions">
      <button type="button" id="btn-copy" title="Copy SVG markup">Copy SVG</button>
      <button type="button" id="btn-png" title="Download PNG (2×)">PNG</button>
      <button type="button" id="btn-svg" class="primary" title="Download SVG (⌘/Ctrl+E)">Export SVG</button>
    </div>
  </header>

  <main id="stage" aria-label="Artboard">
    <svg id="art" role="img" aria-labelledby="art-title" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <title id="art-title">Glyph outlines</title>
      <rect id="art-paper" width="100" height="100"/>
      <path id="art-ink" fill-rule="nonzero" d=""/>
    </svg>
  </main>

  <footer class="bar timeline">
    <button type="button" id="btn-play" aria-pressed="false" title="Play (Space)">Play</button>
    <button type="button" id="btn-back" title="Back one frame (←)" aria-label="Back one frame">‹</button>
    <button type="button" id="btn-fwd" title="Forward one frame (→)" aria-label="Forward one frame">›</button>
    <input type="range" id="time" min="0" max="60" step="0.0166667" value="8" aria-label="Rain time (seconds)">
    <output id="time-out" for="time">8.00 s</output>
    <span id="stats" class="stats"></span>
  </footer>

  <aside id="sidebar" aria-label="Rain and type settings">
    <section class="block">
      <label class="field-label" for="text">Text</label>
      <textarea id="text" rows="3" spellcheck="false"></textarea>
      <div class="font-row">
        <span id="font-name" class="font-name">Instrument Serif</span>
        <label class="file-btn">Load font…<input type="file" id="font-file" accept=".ttf,.otf,.woff,font/ttf,font/otf,font/woff" hidden></label>
        <button type="button" id="font-reset" hidden>Default</button>
      </div>
    </section>
    <div id="controls"></div>
    <section class="block foot">
      <button type="button" id="btn-reset">Reset all</button>
      <button type="button" id="btn-copy-params">Copy settings</button>
    </section>
  </aside>

  <noscript><p class="noscript">Afterhour needs JavaScript.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
