<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afterhour</title>
  </head>
  <body>
    <div class="small-screen" role="alert">
      <p>Afterhour needs a desktop browser.</p>
      <button type="button" id="open-anyway">Open anyway</button>
    </div>

    <div class="app" id="app">
      <aside id="panel" aria-label="Controls">
        <header class="panel-header">
          <h1 class="brand">Afterhour</h1>
          <button
            type="button"
            id="panel-toggle"
            class="icon-button"
            aria-controls="panel-body"
            aria-expanded="true"
            aria-label="Hide controls"
          >
            «
          </button>
        </header>

        <div id="panel-body">
          <section class="group" aria-labelledby="g-text">
            <h2 class="group-title"><label for="text-input" id="g-text">Text</label></h2>
            <textarea id="text-input" rows="4" spellcheck="false"></textarea>
          </section>

          <div class="tabs" role="tablist" aria-label="Control groups">
            <button
              type="button"
              role="tab"
              id="tab-type"
              aria-controls="tp-type"
              aria-selected="true"
            >
              Type
            </button>
            <button
              type="button"
              role="tab"
              id="tab-layout"
              aria-controls="tp-layout"
              aria-selected="false"
              tabindex="-1"
            >
              Layout
            </button>
            <button
              type="button"
              role="tab"
              id="tab-rain"
              aria-controls="tp-rain"
              aria-selected="false"
              tabindex="-1"
              aria-disabled="true"
              title="Sprint 2"
            >
              Rain
            </button>
          </div>

          <div role="tabpanel" id="tp-type" aria-labelledby="tab-type">
            <section class="group" aria-labelledby="g-font">
              <h2 class="group-title"><label for="font-search" id="g-font">Font</label></h2>
              <p class="font-current" id="font-current" aria-live="polite"></p>
              <div class="combo">
                <input
                  id="font-search"
                  type="text"
                  role="combobox"
                  aria-expanded="false"
                  aria-controls="font-list"
                  aria-autocomplete="list"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="Search fonts"
                />
                <ul id="font-list" role="listbox" aria-label="Fonts" hidden></ul>
              </div>
              <label class="upload">
                <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2" />
                Upload a font file (.ttf .otf .woff .woff2) or drop it anywhere
              </label>
              <p class="error" id="font-error" role="alert" hidden></p>
            </section>
            <section class="group" aria-labelledby="g-size">
              <h2 id="g-size" class="group-title">Weight &amp; size</h2>
              <fieldset class="field weights">
                <legend>Weight</legend>
                <div class="weight-strip" id="weight-strip"></div>
                <p class="weight-name" id="weight-name" aria-hidden="true"></p>
              </fieldset>
              <div class="field">
                <label for="font-size-range">Size</label>
                <input type="range" id="font-size-range" min="12" max="240" step="1" />
                <input
                  type="number"
                  id="font-size-number"
                  min="12"
                  max="240"
                  step="1"
                  aria-label="Size in pixels"
                />
                <span class="unit">px</span>
              </div>
            </section>
          </div>

          <div role="tabpanel" id="tp-layout" aria-labelledby="tab-layout" hidden>
            <section class="group" aria-labelledby="g-spacing">
              <h2 id="g-spacing" class="group-title">Spacing</h2>
              <div class="field">
                <div class="field-label">
                  <label for="letter-spacing">Tracking</label>
                  <button
                    type="button"
                    class="auto-toggle"
                    data-auto-for="letter-spacing"
                    aria-pressed="true"
                    title="Follow the font size"
                    aria-label="Automatic tracking from size"
                  >
                    Auto
                  </button>
                </div>
                <input type="range" id="letter-spacing" min="-0.05" max="0.5" step="0.005" />
                <output for="letter-spacing"></output>
              </div>
              <div class="field">
                <div class="field-label">
                  <label for="line-height">Line height</label>
                  <button
                    type="button"
                    class="auto-toggle"
                    data-auto-for="line-height"
                    aria-pressed="true"
                    title="Follow the font size"
                    aria-label="Automatic line height from size"
                  >
                    Auto
                  </button>
                </div>
                <input type="range" id="line-height" min="0.8" max="2.5" step="0.05" />
                <output for="line-height"></output>
              </div>
              <div class="field">
                <label for="max-width">Width</label>
                <input type="range" id="max-width" min="20" max="100" step="1" />
                <output for="max-width"></output>
              </div>
              <p class="measure" id="measure" aria-live="polite"></p>
            </section>
            <section class="group" aria-labelledby="g-artboard">
              <h2 id="g-artboard" class="group-title">Artboard</h2>
              <div class="field artboard-size">
                <label for="artboard-w">Size</label>
                <input
                  type="number"
                  id="artboard-w"
                  min="320"
                  max="4096"
                  step="1"
                  aria-label="Artboard width in pixels"
                />
                <span class="unit" aria-hidden="true">×</span>
                <input
                  type="number"
                  id="artboard-h"
                  min="320"
                  max="4096"
                  step="1"
                  aria-label="Artboard height in pixels"
                />
                <span class="unit">px</span>
              </div>
            </section>
            <section class="group" aria-labelledby="g-align">
              <h2 id="g-align" class="group-title">Alignment</h2>
              <div class="segmented" role="radiogroup" aria-labelledby="g-align">
                <label><input type="radio" name="align" value="left" />Left</label>
                <label><input type="radio" name="align" value="center" />Center</label>
                <label><input type="radio" name="align" value="right" />Right</label>
              </div>
            </section>
          </div>

          <div role="tabpanel" id="tp-rain" aria-labelledby="tab-rain" hidden></div>

          <div class="group">
            <button type="button" id="reset" class="text-button">Reset to defaults</button>
          </div>
        </div>
      </aside>

      <main id="preview">
        <button
          type="button"
          id="panel-show"
          class="icon-button"
          aria-controls="panel"
          aria-label="Show controls"
          hidden
        >
          »
        </button>
        <button
          type="button"
          id="squint-view"
          class="icon-button view-toggle"
          aria-pressed="false"
          aria-label="Squint view (hold B)"
          title="Squint view · hold B"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="8" stroke-dasharray="2 2.2" />
            <circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none" opacity="0.6" />
          </svg>
        </button>
        <button
          type="button"
          id="rulers-toggle"
          class="icon-button view-toggle rulers-toggle"
          aria-pressed="false"
          aria-label="Rulers (Command or Control R)"
          title="Rulers · ⌘R"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path d="M3 3h18v6H9v12H3z" />
            <path d="M7 3v3M11 3v2M15 3v3M19 3v2M3 13h3M3 17h2" />
          </svg>
        </button>
        <div class="pasteboard" id="pasteboard">
          <canvas class="ruler ruler-x" id="ruler-x" aria-hidden="true" hidden></canvas>
          <canvas class="ruler ruler-y" id="ruler-y" aria-hidden="true" hidden></canvas>
          <div class="artboard-frame" id="artboard-frame">
            <div class="artboard" id="artboard">
              <div class="preview-scroll" id="preview-scroll">
                <div class="preview-block" id="preview-block">
                  <p class="preview-text" id="preview-text"></p>
                  <div
                    class="width-handle"
                    id="width-handle"
                    title="Drag to change the width"
                  ></div>
                </div>
              </div>
            </div>
            <i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i
            ><i class="crop br"></i>
            <p class="artboard-label" id="artboard-label"></p>
          </div>
        </div>
        <div class="gesture-tip" id="gesture-tip" hidden></div>
        <p class="gesture-hint">
          Drag text: ↔ tracking · ↕ line height · Scroll or pinch: size · Drag edge: width ·
          Double-click: edit · Shift fine · Alt one axis · Hold B: squint
        </p>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
